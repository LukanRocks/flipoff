<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>FlipOff.</title>
  </head>

  <body>
    <!-- Loading line — the first thing on the page, flush to the top edge -->
    <div class="loading-bar" id="countdown-bar" role="progressbar" aria-label="Time until next message">
      <div class="loading-fill" id="countdown-fill"></div>
    </div>

    <!-- Navbar -->
    <header class="header">
      <div class="header-logo">
        FlipOff.
        <span class="config-indicator" id="config-indicator"></span>
      </div>
      <nav class="header-nav">
        <!--
          Icons are lucide (ISC), inlined rather than imported: board/ has no
          runtime dependencies and four static icons are not worth its first.
        -->
        <a href="/admin" class="icon-btn" id="admin-btn" data-tooltip="Settings" aria-label="Settings">
          <!-- lucide: settings -->
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </a>

        <button class="icon-btn" id="fullscreen-btn" data-tooltip="Fullscreen" aria-label="Toggle fullscreen">
          <!-- lucide: maximize-2 -->
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6" />
            <path d="m21 3-7 7" />
            <path d="m3 21 7-7" />
            <path d="M9 21H3v-6" />
          </svg>
        </button>

        <!--
          Both sound icons ship; .is-off on the button picks one. The old rule
          hid paths by position (svg path:nth-child(2)), which only worked for
          the exact markup it was written against.
        -->
        <button class="icon-btn" id="volume-btn" data-tooltip="Sound: Authentic" aria-label="Toggle sound">
          <!-- lucide: volume-2 -->
          <svg
            class="icon-on"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
            />
            <path d="M16 9a5 5 0 0 1 0 6" />
            <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
          </svg>
          <!-- lucide: volume-x -->
          <svg
            class="icon-off"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
            />
            <line x1="22" x2="16" y1="9" y2="15" />
            <line x1="16" x2="22" y1="9" y2="15" />
          </svg>
        </button>
      </nav>
    </header>

    <!-- Board — centred in whatever height is left -->
    <main class="board-section" id="board-container" role="status" aria-live="polite" aria-label="Split-flap message display"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
