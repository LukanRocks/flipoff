<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>FlipOff. Display</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #board-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-status {
        color: #666;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .board {
        border-radius: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <section id="board-container">
      <!-- Shown until /api/config answers; main.js removes it once the board mounts. -->
      <p class="boot-status" id="boot-status">Connecting to server…</p>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
